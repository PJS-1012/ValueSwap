spring:
  datasource:
    url: jdbc:h2:mem:valueswap;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

valueswap:
  jwt:
    secret: test-only-secret-key-with-at-least-32-bytes
    expiration-ms: 3600000
  matching:
    threshold: 60
    interval-ms: 300000
    scheduler-enabled: false
